<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Demonstration of loops</h2>
    <script>
        document.write("<h3>for loop</h3>")
        for(let i=1;i<=6;i++)
    {
        document.write(i+" ");
    }

    document.write("<h3>while loop</h3>")
    let j=1; 
    while(j<=6)
    {
          document.write(j+" ");
          j++;
    }
    document.write("<h3>do-while loop</h3>")
    let k=1;
    do{
         document.write(k+" ");
         k++;
    }while(k<=6);
    </script>

    
</body>
</html>
